            - ShiftID
        type: object
        properties:
            ShiftID:
                description: ''
                type: string
        example:
            ShiftID: 5f9b9e90-cec3-11f0-b43f-901b0eec5991
    new-Schedule:
        description: ''
        required:
            - ScheduleName
            - StartDate
            - EndDate
        type: object
        properties:
            ScheduleName:
                description: ''
                type: string
